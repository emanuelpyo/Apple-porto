{{define "header"}}
<div
  class="fixed top-3 md:top-5 left-0 right-0 z-50 flex justify-center px-4 pointer-events-none w-full"
>
  <div class="w-full max-w-4xl pointer-events-auto">
    <div class="reveal" data-reveal="down">
      <div
        class="relative flex items-center justify-between py-2.5 px-4 sm:px-6 liquid-glass rounded-full transition-all duration-300"
      >
        <div class="flex flex-row items-center gap-2"></div>

        <nav
          class="hidden md:flex items-center gap-1 lg:gap-1.5"
          aria-label="Navigasi utama"
          data-i18n-aria="nav_main"
        >
          <button
            data-scroll="home"
            data-section="home"
            class="nav-link text-text-secondary hover:text-text-primary hover:bg-white/50 px-3 py-1.5 rounded-full text-xs font-semibold tracking-tight transition-all duration-200 cursor-pointer"
            data-i18n="nav_home"
          >
            Beranda
          </button>
          <button
            data-scroll="companies"
            data-section="companies"
            class="nav-link text-text-secondary hover:text-text-primary hover:bg-white/50 px-3 py-1.5 rounded-full text-xs font-semibold tracking-tight transition-all duration-200 cursor-pointer"
            data-i18n="nav_companies"
          >
            Kolaborasi
          </button>
          <button
            data-scroll="about"
            data-section="about"
            class="nav-link text-text-secondary hover:text-text-primary hover:bg-white/50 px-3 py-1.5 rounded-full text-xs font-semibold tracking-tight transition-all duration-200 cursor-pointer"
            data-i18n="nav_about"
          >
            Tentang
          </button>
          <button
            data-scroll="experience"
            data-section="experience"
            class="nav-link text-text-secondary hover:text-text-primary hover:bg-white/50 px-3 py-1.5 rounded-full text-xs font-semibold tracking-tight transition-all duration-200 cursor-pointer"
            data-i18n="nav_experience"
          >
            Pengalaman
          </button>
          <button
            data-scroll="projects"
            data-section="projects"
            class="nav-link text-text-secondary hover:text-text-primary hover:bg-white/50 px-3 py-1.5 rounded-full text-xs font-semibold tracking-tight transition-all duration-200 cursor-pointer"
            data-i18n="nav_projects"
          >
            Karya
          </button>
          <button
            data-scroll="contacts"
            data-section="contacts"
            class="nav-link text-text-secondary hover:text-text-primary hover:bg-white/50 px-3 py-1.5 rounded-full text-xs font-semibold tracking-tight transition-all duration-200 cursor-pointer"
            data-i18n="nav_contacts"
          >
            Kontak
          </button>
        </nav>

        <div class="flex items-center gap-2">
          <!-- Language selector with Apple segmented control feel -->
          <div class="relative" id="lang-switcher">
            <button
              id="lang-toggle"
              type="button"
              class="cursor-pointer text-text-secondary hover:text-text-primary transition-all flex items-center gap-1.5 px-3 py-1.5 rounded-full bg-white/70 hover:bg-white border border-white/80 text-xs font-bold tracking-wider shadow-xs"
              aria-label="Ganti bahasa"
              aria-expanded="false"
              aria-haspopup="true"
              data-i18n-aria="lang_switch"
            >
              <svg
                class="w-3.5 h-3.5 text-accent"
                aria-hidden="true"
                xmlns="http://www.w3.org/2000/svg"
                fill="none"
                viewBox="0 0 24 24"
                stroke="currentColor"
                stroke-width="2"
              >
                <circle cx="12" cy="12" r="10" />
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  d="M2 12h20M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"
                />
              </svg>
              <span id="lang-label" class="uppercase">ID</span>
            </button>

            <!-- Language dropdown menu -->
            <div
              id="lang-menu"
              class="scale-0 opacity-0 pointer-events-none transform absolute top-11 right-0 z-50 origin-top-right transition-all duration-200 ease-out liquid-glass p-1.5 rounded-2xl w-44 flex flex-col gap-1 shadow-2xl"
              role="menu"
              aria-label="Pilihan bahasa"
            >
              <button
                type="button"
                data-lang-choice="id"
                role="menuitem"
                class="lang-option w-full text-left px-3 py-2 rounded-xl text-xs font-semibold transition-all flex items-center justify-between text-text-primary hover:bg-accent/10 cursor-pointer"
              >
                <span>Bahasa Indonesia</span>
                <span
                  class="lang-check text-[10px] uppercase tracking-wider text-accent font-bold"
                  >ID</span
                >
              </button>
              <button
                type="button"
                data-lang-choice="en"
                role="menuitem"
                class="lang-option w-full text-left px-3 py-2 rounded-xl text-xs font-semibold transition-all flex items-center justify-between text-text-secondary hover:text-text-primary hover:bg-accent/10 cursor-pointer"
              >
                <span>English</span>
                <span
                  class="lang-check text-[10px] uppercase tracking-wider text-text-secondary/50 font-bold"
                  >EN</span
                >
              </button>
            </div>
          </div>

          <!-- Mobile menu toggle -->
          <button
            id="menu-toggle"
            class="md:hidden text-text-secondary hover:text-text-primary p-2 rounded-full bg-white/70 hover:bg-white border border-white/80 shadow-xs transition-all cursor-pointer"
            aria-label="Buka menu navigasi"
            aria-expanded="false"
            data-i18n-aria="menu_open"
          >
            <svg
              class="w-4 h-4"
              aria-hidden="true"
              xmlns="http://www.w3.org/2000/svg"
              fill="none"
              viewBox="0 0 24 24"
              stroke="currentColor"
              stroke-width="2"
            >
              <path
                class="menu-icon-open"
                stroke-linecap="round"
                stroke-linejoin="round"
                d="M4 6h16M4 12h16M4 18h16"
              />
              <path
                class="menu-icon-close hidden"
                stroke-linecap="round"
                stroke-linejoin="round"
                d="M6 18L18 6M6 6l12 12"
              />
            </svg>
          </button>
        </div>

        <!-- Mobile menu sheet (iOS style modal menu) -->
        <div
          id="mobile-menu"
          class="scale-0 opacity-0 pointer-events-none md:hidden transform absolute top-14 right-0 z-50 origin-top-right transition-all duration-200 ease-out liquid-glass p-3 rounded-2xl w-52 flex flex-col gap-1 shadow-2xl"
        >
          <button
            data-scroll="home"
            data-section="home"
            class="nav-link text-text-secondary hover:text-text-primary px-3 py-2 rounded-xl text-left text-sm font-semibold hover:bg-white/50 transition-colors cursor-pointer"
            data-i18n="nav_home"
          >
            Beranda
          </button>
          <button
            data-scroll="companies"
            data-section="companies"
            class="nav-link text-text-secondary hover:text-text-primary px-3 py-2 rounded-xl text-left text-sm font-semibold hover:bg-white/50 transition-colors cursor-pointer"
            data-i18n="nav_companies"
          >
            Kolaborasi
          </button>
          <button
            data-scroll="about"
            data-section="about"
            class="nav-link text-text-secondary hover:text-text-primary px-3 py-2 rounded-xl text-left text-sm font-semibold hover:bg-white/50 transition-colors cursor-pointer"
            data-i18n="nav_about"
          >
            Tentang
          </button>
          <button
            data-scroll="experience"
            data-section="experience"
            class="nav-link text-text-secondary hover:text-text-primary px-3 py-2 rounded-xl text-left text-sm font-semibold hover:bg-white/50 transition-colors cursor-pointer"
            data-i18n="nav_experience"
          >
            Pengalaman
          </button>
          <button
            data-scroll="projects"
            data-section="projects"
            class="nav-link text-text-secondary hover:text-text-primary px-3 py-2 rounded-xl text-left text-sm font-semibold hover:bg-white/50 transition-colors cursor-pointer"
            data-i18n="nav_projects"
          >
            Karya
          </button>
          <button
            data-scroll="contacts"
            data-section="contacts"
            class="nav-link text-text-secondary hover:text-text-primary px-3 py-2 rounded-xl text-left text-sm font-semibold hover:bg-white/50 transition-colors cursor-pointer"
            data-i18n="nav_contacts"
          >
            Kontak
          </button>
        </div>
      </div>
    </div>
  </div>
</div>
{{end}}
