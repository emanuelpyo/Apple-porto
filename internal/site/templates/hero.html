{{define "hero"}}
<section id="home" class="w-full max-w-6xl mx-auto cursor-default grid grid-cols-1 md:grid-cols-12 gap-10 lg:gap-16 items-center px-6 md:px-12 pt-32 sm:pt-36 md:pt-44 pb-20 md:pb-28">
  <div class="md:col-span-7 flex flex-col items-start text-left">
    <div class="reveal" data-reveal="fade">
      <div class="inline-flex items-center gap-2 px-3.5 py-1.5 rounded-full bg-white/70 border border-white/80 shadow-xs text-xs font-semibold text-text-secondary mb-6 backdrop-blur-md">
        <span class="w-2 h-2 rounded-full bg-emerald-500 inline-block shadow-xs animate-pulse"></span>
        <span data-i18n="hero_connect">Terhubung</span>
      </div>

      <h1 class="text-text-primary text-4xl sm:text-5xl lg:text-6xl font-extrabold tracking-tight leading-[1.08] mb-4">
        <span data-i18n="hero_greeting">Halo, saya</span>
        <span class="block font-black text-slate-900 mt-1">{{.Profile.Name}}</span>
      </h1>

      <div class="flex items-center text-xl sm:text-2xl text-accent font-bold tracking-tight min-h-[2rem] mb-6">
        <span id="hero-role"></span>
        <span class="animate-cursor text-accent ml-0.5">|</span>
      </div>

      <p id="hero-tagline" class="text-text-secondary text-base sm:text-lg leading-relaxed max-w-xl font-medium mb-8" data-i18n-id="{{.Profile.Tagline.ID}}" data-i18n-en="{{.Profile.Tagline.EN}}">
        {{.Profile.Tagline.ID}}
      </p>

      <div class="flex flex-wrap items-center gap-3 w-full sm:w-auto">
        <button data-scroll="projects" class="cursor-pointer text-sm font-bold bg-slate-900 text-white px-7 py-3.5 rounded-full flex items-center justify-center gap-2 hover:bg-slate-800 active:scale-95 transition-all shadow-md">
          <span data-i18n="hero_view_work">Lihat Karya</span>
          <svg class="w-4 h-4" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M19 9l-7 7-7-7" />
          </svg>
        </button>

        <a id="hero-cv-link" href="{{.CVPath}}" download class="hidden cursor-pointer text-sm font-bold bg-white/80 hover:bg-white text-text-primary px-7 py-3.5 rounded-full flex items-center justify-center gap-2 active:scale-95 transition-all shadow-xs border border-white/80 backdrop-blur-md">
          <span data-i18n="hero_download_cv">Unduh CV</span>
          <svg class="w-4 h-4" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4" />
          </svg>
        </a>
        <span id="hero-cv-disabled" aria-disabled="true" title="CV belum tersedia" data-i18n-title="hero_cv_unavailable" class="text-sm font-bold bg-white/40 text-text-secondary/50 px-7 py-3.5 rounded-full flex items-center justify-center gap-2 cursor-not-allowed select-none border border-white/40">
          <span data-i18n="hero_download_cv">Unduh CV</span>
        </span>
      </div>

      <div class="flex items-center gap-3 mt-10 pt-6 border-t border-white/50">
        {{range .Socials}}
        <a href="{{.Href}}" target="_blank" rel="noopener noreferrer" aria-label="{{.Label}}" class="p-2.5 rounded-full bg-white/70 hover:bg-white text-text-primary shadow-xs border border-white/80 transition-all">
          {{.Icon}}
        </a>
        {{end}}
      </div>
    </div>
  </div>

  <div class="md:col-span-5 flex justify-center md:justify-end relative">
    <div class="reveal relative" data-reveal="fade">
      <div class="relative w-64 h-64 sm:w-72 sm:h-72 lg:w-80 lg:h-80 rounded-3xl overflow-hidden shadow-2xl border-2 border-white/80">
        <img src="/images/profile.jpeg" alt="{{.Profile.Name}}" width="400" height="400" class="w-full h-full object-cover scale-100 hover:scale-105 transition-transform duration-700 ease-out" />
      </div>

      <!-- Quick stat float cards - Liquid Glass style -->
      <div class="absolute -bottom-6 -left-4 sm:-left-8 flex flex-col gap-2.5 z-20">
        {{range $i, $stat := .QuickStats}}
        <div class="liquid-glass flex items-center gap-2.5 px-4 py-2.5 rounded-2xl shadow-lg transition-transform duration-300 hover:-translate-y-0.5">
          <div class="text-accent">{{$stat.Icon}}</div>
          <span class="text-xs font-semibold text-text-primary whitespace-nowrap" data-i18n-id="{{$stat.Message.ID}}" data-i18n-en="{{$stat.Message.EN}}">{{$stat.Message.ID}}</span>
        </div>
        {{end}}
      </div>
    </div>
  </div>
</section>
{{end}}
