{{define "hero"}}
<section id="home" class="hero-lanyard cursor-default">
  <div class="hero-word" aria-hidden="true"><span class="hero-word__line">PORTO</span><span class="hero-word__line">FOLIO</span></div>
  <div class="hero-lanyard__stage">
    <div class="lanyard">
      <div class="lanyard__strap" aria-hidden="true"></div>
      <div class="lanyard__clip" aria-hidden="true"></div>

      <article class="badge" aria-label="Kartu identitas {{.Profile.Name}}">
        <div class="badge__case">
          <div class="badge__card">
            <span class="badge__punch" aria-hidden="true"></span>
            <div class="badge__portrait">
              <img
                src="/images/profile.jpeg"
                alt="{{.Profile.Name}}"
                width="652"
                height="534"
                loading="eager"
                decoding="async"
              />
            </div>
            <p class="badge__name">{{.Profile.Name}}</p>
            <p class="badge__role">
              <span id="hero-role"></span
              ><span class="badge__caret" aria-hidden="true">|</span>
            </p>
            <dl class="badge__facts">
              <div>
                <dt data-i18n-id="Lokasi" data-i18n-en="Location">Lokasi</dt>
                <dd
                  data-i18n-id="{{.Profile.Location.ID}}"
                  data-i18n-en="{{.Profile.Location.EN}}"
                >
                  {{.Profile.Location.ID}}
                </dd>
              </div>
              <div>
                <dt data-i18n-id="Pendidikan" data-i18n-en="Education">
                  Pendidikan
                </dt>
                <dd
                  data-i18n-id="{{.Profile.Education.ID}}"
                  data-i18n-en="{{.Profile.Education.EN}}"
                >
                  {{.Profile.Education.ID}}
                </dd>
              </div>
            </dl>
          </div>
          <span class="badge__sheen" aria-hidden="true"></span>
        </div>
      </article>
    </div>
  </div>

  <div class="hero-lanyard__transition" aria-hidden="true">
    <span class="hero-lanyard__rule"></span>
    <span class="hero-lanyard__index"
      >01 / <span data-i18n="proj_eyebrow">Portofolio</span></span
    >
    <span class="hero-lanyard__cue" aria-hidden="true">
      <svg
        viewBox="0 0 12 18"
        width="12"
        height="18"
        fill="none"
        stroke="currentColor"
        stroke-width="1.5"
        stroke-linecap="round"
        stroke-linejoin="round"
      >
        <path d="M6 1v14M1 10l5 5 5-5" />
      </svg>
    </span>
  </div>
</section>
{{end}}
