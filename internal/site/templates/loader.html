{{define "loader"}}
<div id="page-loader" class="splash-failsafe fixed inset-0 z-[100] bg-white flex flex-col items-center justify-center overflow-hidden" aria-hidden="true">
  <div class="relative overflow-hidden flex items-center justify-center mb-2">
    <div class="loader-title text-3xl md:text-4xl font-extrabold text-slate-900 tracking-tight">Deryl<span class="text-accent font-black">.</span></div>
  </div>
  <div class="relative overflow-hidden flex items-center justify-center">
    <div class="loader-sub text-xs font-bold tracking-wider uppercase text-text-secondary" data-i18n="loader_title">Memuat Portofolio</div>
  </div>
  <div class="mt-6 w-36 h-[2px] bg-slate-200 rounded-full overflow-hidden relative">
    <div class="loader-bar absolute inset-y-0 left-0 w-full bg-accent rounded-full"></div>
  </div>
</div>
{{end}}
